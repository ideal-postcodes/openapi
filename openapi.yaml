  /sign_up/{cli_token}:
    get:
      tags:
        - Sign Up
      summary: Poll CLI Signup Token
      description: |
        Returns the account credentials for a minted `cli_token` once signup has completed, and `202 Accepted` until then. The CLI calls this endpoint repeatedly after sending the user to the `signup_url` returned by `POST /sign_up`.

        - `202 Accepted`. The accounts service has not propagated the user yet, or has propagated the user but not minted the first API key. Keep polling. An unknown token also returns `202`, because the API does not record a token at mint time, so the CLI must set its own polling deadline.
        - `200 OK`. The user and first API key exist. The API returns the credentials once. Later polls return `410 Gone`.
        - `410 Gone`. The token has expired or has already been claimed.
      operationId: SignUpClaim
      parameters:
        - name: cli_token
          in: path
          required: true
          description: The token returned by `POST /sign_up`.
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: Credentials ready
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - result
                properties:
                  code:
                    type: integer
                    example: 2000
                  message:
                    type: string
                    example: Success
                  result:
                    type: object
                    required:
                      - user_token
                      - test_api_key
                      - user_id
                    properties:
                      user_token:
                        type: string
                        description: User-level token used to manage account resources via the api.
                      test_api_key:
                        type: string
                        description: Initial test API key for the account.
                      user_id:
                        type: string
                        description: Internal api user id.
        '202':
          description: Pending, keep polling
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - result
                properties:
                  code:
                    type: integer
                    example: 2020
                  message:
                    type: string
                    example: Pending
                  result:
                    type: object
                    required:
                      - status
                    properties:
                      status:
                        type: string
                        enum:
                          - pending
        '410':
          description: Signup token expired or already claimed
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                properties:
                  code:
                    type: integer
                    example: 4100
                  message:
                    type: string
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-codeSamples:
        - lang: http
          label: URL
          source: |
            https://api.ideal-postcodes.co.uk/v1/sign_up/eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        - lang: cURL
          label: curl
          source: |
            curl 'https://api.ideal-postcodes.co.uk/v1/sign_up/eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
        - lang: JavaScript
          label: JavaScript
          source: |
            const response = await fetch('https://api.ideal-postcodes.co.uk/v1/sign_up/eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...');

            const { result } = await response.json();
        - lang: Python
          label: Python
          source: |
            import requests

            response = requests.get("https://api.ideal-postcodes.co.uk/v1/sign_up/eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...")
            result = response.json()["result"]
        - lang: Ruby
          label: Ruby
          source: |
            require "net/http"
            require "json"

            uri = URI("https://api.ideal-postcodes.co.uk/v1/sign_up/eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...")
            result = JSON.parse(Net::HTTP.get(uri))["result"]
        - lang: PHP
          label: PHP
          source: |
            <?php
            $response = file_get_contents("https://api.ideal-postcodes.co.uk/v1/sign_up/eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...");
            $result = json_decode($response, true)["result"];
components:
  parameters:
    ApiKeyParam:
      description: |
        **API Key**

        Your unique identifier that allows access to our APIs.

        Begins `ak_`. Available from your dashboard.
      example: ak_test
      explode: false
      in: query
      name: api_key
      schema:
        type: string
      style: form
    FilterParam:
      name: filter
      in: query
      style: form
      explode: false
      schema:
        type: string
      description: |
        **Restrict Result Fields**

        Comma separated whitelist of address elements to return. 

        E.g. `filter=line_1,line_2,line_3` returns only the `line_1`, `line_2` and `line_3` address elements in your response.
      example: line_1,line_2,line_3
    PageParam:
      name: page
      in: query
      style: form
      explode: false
      schema:
        type: integer
        minimum: 0
        maximum: 100
        default: 0
        format: int32
      description: |
        **Page**

        0 indexed indicator of the page of results to receive. Virtually all postcode results are returned on page 0. 

        A small number of Multiple Residence postcodes may need pagination (i.e. have more than 100 premises).
      example: 1
    TagsParam:
      name: tags
      in: query
      style: form
      explode: false
      required: false
      schema:
        type: string
      description: |
        **Tags**

        A comma separated list of tags to query over.

        Useful if you want to specify the circumstances in which the request was made.

        If you specify multiple tags, the response comprises only requests that satisfy all of them. Searching `"foo,bar"` queries only requests tagged both `"foo"` and `"bar"`.
      example: foo,bar
    DatasetParam:
      name: dataset
      in: query
      style: form
      explode: false
      schema:
        type: array
        items:
          $ref: '#/components/schemas/Dataset'
      description: |
        **Filter by Dataset**

        Comma-separated list of datasets to search within.

        Filters results to only include addresses from the specified datasets. Useful for keys with multiple overlapping datasets enabled (e.g. `paf` and `abp`).
      example: paf,nyb
    ContextParam:
      name: context
      in: query
      style: form
      explode: false
      example: GBR
      description: |
        **Context**

        Limits search results, typically within a country.
      schema:
        type: string
    ApiKeyPathParam:
      name: key
      in: path
      required: true
      style: simple
      explode: false
      schema:
        type: string
      example: ak_test
      description: |
        **API Key**

        The API Key to retrieve. Begins `ak_`.
    UserTokenParam:
      in: query
      style: form
      explode: false
      schema:
        type: string
      name: user_token
      description: |
        **Private User Token**

        A secret key used for sensitive operations on your account and API Keys.

        Your user token can be retrieved and managed from your [accounts page](https://account.ideal-postcodes.co.uk/account).

        Typically begins `uk_...`
      example: uk_B59ScW1p1HHouf1VqclEPZUx
    StartParam:
      name: start
      style: form
      in: query
      schema:
        type: integer
        format: int64
        minimum: 0
      description: |
        **Start Timestamp**

        A start date/time in the form of a UNIX Timestamp in milliseconds. E.g. `1418556452651`
      example: 1418556452651
    EndParam:
      name: end
      style: form
      in: query
      schema:
        type: integer
        format: int64
        minimum: 0
      description: |
        **End Timestamp**

        An end date/time in the form of a UNIX Timestamp in milliseconds. E.g.  `1418556477882`
      example: 1418556492651
    LicenseeParam:
      example: sl_hk71kco54zGSGvF9eXXrvvnMOLLNh
      description: |
        **Licensee Key**

        Uniquely identifies a licensee.
      explode: false
      in: query
      name: licensee
      schema:
        type: string
      style: form
    LimitParam:
      name: limit
      in: query
      style: form
      explode: false
      schema:
        minimum: 1
        maximum: 100
        default: 10
        type: integer
        format: int32
      example: 5
      description: |
        **Limit**

        Specifies the maximum number of records to retrieve.

        By default the limit is 10. Requesting a larger result set adds latency.
    BiasLonLatParam:
      name: bias_lonlat
      in: query
      style: form
      explode: false
      schema:
        type: string
      description: |
        **Bias by Geolocation**

        Bias search to a geospatial circle determined by an origin and radius in metres. Max radius is `50000`. 
        Uses the format bias_lonlat=[longitude],[latitude],[radius in metres].
        Only one geospatial bias may be provided.
      example: '-2.095,57.15,100'
    BiasIpParam:
      name: bias_ip
      in: query
      style: form
      explode: false
      required: false
      description: |
        **Bias by Geolocation of IP**

        Biases search based on approximate geolocation of IP address.

        Set `bias_ip=true` to enable.
      schema:
        type: string
        enum:
          - 'true'
    BoxParam:
      name: box
      in: query
      style: form
      explode: false
      schema:
        type: string
      description: |
        **Filter by Bounding Box**

        Restrict search to a geospatial box determined by the "top-left" and "bottom-right" geolocations.

        Supply 4 comma separated values ordered `top_left_lon,top_left_lat,bottom_right_lon,bottom_right_lat`. The top-left longitude must be less than the bottom-right longitude, and the top-left latitude greater than the bottom-right latitude. A box which fails either check is ignored.

        Only one geospatial box can be provided.
      example: '-2.096,57.15,-2.095,57.14'
    PostcodeOutwardParam:
      name: postcode_outward
      in: query
      style: form
      explode: false
      schema:
        type: string
      description: |
        **Filter by Outward Code**

        Restrict result set to addresses with a matching outward code.

        The outward code is the first half of a postcode. E.g. the outward code for `SW1A 2AA` is `SW1A`.
      example: SW1A
    PostcodeParam:
      name: postcode
      in: query
      style: form
      explode: false
      schema:
        type: string
      description: |-
        **Filter by postcode**
        Restrict result set to matching postcodes only.
        Can be combined with query to perform a postcode and building number or name search.
      example: SW1A 2AA
    PostcodeAreaParam:
      name: postcode_area
      in: query
      style: form
      explode: false
      schema:
        type: string
      description: |
        **Filter by Postcode Area**

        Postcode area represents the first one or two non-numeric characters of a postcode. E.g. the postcode area of `SW1A 2AA` is `SW`.

        Can be combined with query to perform a postcode and building search.
      example: SW
    PostcodeSectorParam:
      name: postcode_sector
      in: query
      style: form
      explode: false
      schema:
        type: string
      description: |
        **Filter by Postcode Sector**

        Postcode sector is the outward code plus first numeric of the inward code. E.g. postcode sector of `SW1A 2AA` is `SW1A 2`
      example: SW1A 2
    PostTownParam:
      name: post_town
      in: query
      style: form
      explode: false
      schema:
        type: string
      description: |
        **Filter by Town or City**

        Restrict addresses to matching town, city or other locality identifier.
      example: London
    UPRNParam:
      name: uprn
      in: query
      style: form
      explode: false
      schema:
        type: integer
      description: |
        **Filter by UPRN**

        Does not accept comma separated terms. Only a single term is permitted.
      example: '100023336956'
    CountryParam:
      name: country
      in: query
      style: form
      explode: false
      schema:
        type: string
      description: |
        **Filter by country**

        Filters by country name.

        In the GBR context, the country is never United Kingdom. It is England, Scotland, Wales, Northern Ireland, Jersey, Guernsey or Isle of Man.
      example: England
    PostcodeTypeParam:
      name: postcode_type
      in: query
      style: form
      explode: false
      schema:
        type: string
      description: |
        **Filter by Postcode Type**

        Useful for separating organisational and residential addresses.
    SmallUserParam:
      name: su_organisation_indicator
      in: query
      style: form
      explode: false
      schema:
        type: string
      description: |
        **Filter by Organisation Indicator**

        Useful for separating organisational and residential addresses.
      example: 'Y'
    BiasPostcodeOutwardParam:
      name: bias_postcode_outward
      in: query
      style: form
      explode: false
      schema:
        type: string
      description: |-
        **Bias by Outward Code**
        Boosts addresses with a matching outward code.
        The outward code is the first half of a postcode. For instance, the outward code of `SW1A 2AA` is `SW1A`.
      example: SW1A
    BiasPostcodeParam:
      name: bias_postcode
      in: query
      style: form
      explode: false
      schema:
        type: string
      description: |-
        **Bias by postcode**
        Boost addresses which match postcode.
        Can be combined with query to perform a postcode and building number or name search.
      example: SW1A2AA
    BiasPostcodeAreaParam:
      name: bias_postcode_area
      in: query
      style: form
      explode: false
      schema:
        type: string
      description: |
        **Bias by Postcode Area**

        Boosts if the first one or two non-numeric characters of a postcode match

        The postcode areas of SW1A 2AA and N1 6RT are SW and N respectively.
      example: SW
    BiasPostcodeSectorParam:
      name: bias_postcode_sector
      in: query
      style: form
      explode: false
      schema:
        type: string
      description: |
        **Bias by Postcode Sector**

        Boost postcode sector matches. The postcode sector comprises the outward code plus first numeric of the inward code.
      example: SW1A 2
    BiasPosttownParam:
      name: bias_post_town
      in: query
      style: form
      explode: false
      schema:
        type: string
      description: |
        **Bias by Town or City**

        Biases results to matching town, city or other locality name.
    BiasThoroughfareParam:
      name: bias_thoroughfare
      in: query
      style: form
      explode: false
      schema:
        type: string
      description: |
        **Bias by Street**

        Bias by street or thoroughfare name.
    BiasCountryParam:
      name: bias_country
      in: query
      style: form
      explode: false
      schema:
        type: string
      description: |
        **Bias by Country**

        Possible values are England, Scotland, Wales, Northern Ireland, Jersey, Guernsey and Isle of Man.
    PostalCodeParam:
      name: postal_code
      in: query
      style: form
      explode: false
      schema:
        type: string
      description: |
        **Filter by postal code**

        Restrict results to addresses with a matching full postal code. Case, spaces and hyphens are ignored. For US addresses the full postal code is the nine digit ZIP+4 (`941021234`); filter on `postal_code_3` for a five digit ZIP. For UK addresses use `postcode`.
      example: 94102-1234
    PostalCode2Param:
      name: postal_code_2
      in: query
      style: form
      explode: false
      schema:
        type: string
      description: |
        **Filter by postal code prefix**

        Restrict results to addresses whose postal code starts with the given segment. For US addresses this is the three digit ZIP prefix (sectional center), e.g. `941` for San Francisco.
      example: '941'
    PostalCode3Param:
      name: postal_code_3
      in: query
      style: form
      explode: false
      schema:
        type: string
      description: |
        **Filter by short postal code**

        Restrict results to addresses with a matching short postal code. For US addresses this is the five digit ZIP code.
      example: '94102'
    CityParam:
      name: city
      in: query
      style: form
      explode: false
      schema:
        type: string
      description: |
        **Filter by city**

        Restrict results to addresses in the named city, town or locality. Case, spaces and accents are ignored, so `San Francisco` and `sanfrancisco` match the same addresses. For UK addresses use `post_town`.
      example: San Francisco
    StateParam:
      name: state
      in: query
      style: form
      explode: false
      schema:
        type: string
      description: |
        **Filter by state**

        Restrict results to addresses in the named state, province or region, e.g. `California`. Case and spaces are ignored.
      example: California
    StateCodeParam:
      name: state_code
      in: query
      style: form
      explode: false
      schema:
        type: string
      description: |
        **Filter by state code**

        Restrict results to addresses with a matching state or region code, e.g. the two letter USPS state abbreviation `CA`. Case is ignored.
      example: CA
    BiasPostalCodeParam:
      name: bias_postal_code
      in: query
      style: form
      explode: false
      schema:
        type: string
      description: |
        **Bias by postal code**

        Boost addresses with a matching full postal code (nine digit ZIP+4 for US addresses). Unmatched addresses still appear, ranked lower.
      example: 94102-1234
    BiasPostalCode2Param:
      name: bias_postal_code_2
      in: query
      style: form
      explode: false
      schema:
        type: string
      description: |
        **Bias by postal code prefix**

        Boost addresses whose postal code starts with the given segment (three digit ZIP prefix for US addresses).
      example: '941'
    BiasPostalCode3Param:
      name: bias_postal_code_3
      in: query
      style: form
      explode: false
      schema:
        type: string
      description: |
        **Bias by short postal code**

        Boost addresses with a matching short postal code (five digit ZIP for US addresses).
      example: '94102'
    BiasCityParam:
      name: bias_city
      in: query
      style: form
      explode: false
      schema:
        type: string
      description: |
        **Bias by city**

        Boost addresses in the named city, town or locality. Case, spaces and accents are ignored. For UK addresses use `bias_posttown`.
      example: San Francisco
    BiasStateParam:
      name: bias_state
      in: query
      style: form
      explode: false
      schema:
        type: string
      description: |
        **Bias by state**

        Boost addresses in the named state, province or region.
      example: California
    BiasStateCodeParam:
      name: bias_state_code
      in: query
      style: form
      explode: false
      schema:
        type: string
      description: |
        **Bias by state code**

        Boost addresses with a matching state or region code, e.g. `CA`.
      example: CA
    IsPoboxParam:
      name: is_pobox
      in: query
      style: form
      explode: false
      schema:
        type: string
        enum:
          - 'true'
          - 'false'
      description: |
        **Filter by PO Box**

        `true` restricts results to PO Box addresses; `false` excludes them. For US addresses this is derived from the USPS record type (`P`).
      example: 'true'
    IsBusinessParam:
      name: is_business
      in: query
      style: form
      explode: false
      schema:
        type: string
        enum:
          - 'true'
          - 'false'
      description: |
        **Filter by business address**

        `true` restricts results to business addresses; `false` excludes them. For US addresses this is derived from the USPS record type (`F`, a firm record).
      example: 'true'
    AddressLongitudeParam:
      name: lon
      in: query
      style: form
      explode: false
      schema:
        type: number
        format: float
        minimum: -180
        maximum: 180
      description: |
        **Longitude**

        Longitude query for reverse geocoding.

        A valid reverse geocode query also needs a latitude (lat=) query.
      example: -0.12767
    AddressLatitudeParam:
      name: lat
      in: query
      style: form
      explode: false
      schema:
        type: number
        format: float
        minimum: -90
        maximum: 90
      description: |
        **Latitude**

        Latitude query for reverse geocoding.

        A valid reverse geocode query also needs a longitude (lon=) query.
      example: 51.503541
    CountryIsoParam:
      name: country_iso
      in: query
      style: form
      explode: false
      schema:
        type: string
      description: |
        **Filter by Country**

        Filter by country ISO code. Uses 3 letter country code (ISO 3166-1) standard.

        Filter by multiple countries with a comma separated list. E.g. `GBR,IRL`
      example: GBR
    BiasCountryIsoParam:
      name: bias_country_iso
      in: query
      style: form
      explode: false
      description: |-
        **Bias by Country**
        Bias by country ISO code. Uses 3 letter country code (ISO 3166-1) standard.
        Bias by multiple countries with a comma separated list. E.g. `GBR,IRL`
      example: GBR
      schema:
        type: string
    LicenseePathParam:
      name: licensee
      in: path
      required: true
      style: simple
      explode: false
      schema:
        type: string
      example: sl_hk71kco54zGSGvF9eXXrvvnMOLLNh
      description: |
        **Licensee Key**

        Uniquely identifies a licensee.
    ConfigParam:
      name: config
      in: path
      required: true
      style: simple
      explode: false
      schema:
        type: string
      description: |
        **Configuration Name**

        User-provided configuration object name.
      example: idpc-be

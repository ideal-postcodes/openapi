          nullable: true
          type: string
          enum:
            - null
        iso_country_2:
          description: Country code in 2 letter ISO format
          x-nullable: true
          nullable: true
          type: string
          enum:
            - null
        country:
          description: Full country name
          x-nullable: true
          nullable: true
          type: string
          enum:
            - null
        current_carrier:
          description: Representation of current phone carrier information like network code, name, country, network type
          x-nullable: true
          nullable: true
          type: string
          enum:
            - null
        original_carrier:
          description: Representation of original phone carrier information like network code, name, country, network type
          x-nullable: true
          nullable: true
          type: string
          enum:
            - null
    PhoneNumberResponse:
      title: Phone Number Verification Response
      type: object
      required:
        - message
        - code
        - result

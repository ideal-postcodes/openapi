    BevAddress:
      title: Austria BEV Address
      description: |-
        An address from the Adressregister, Austria's official address register published by the Bundesamt für Eich- und Vermessungswesen (BEV) under Open Government Data Austria.

        One record per building at an address: the address (`adrcd`) is joined to its building (`subcd`, `objektnummer`), municipality, locality, street and census district lookups.

        Field names follow the German source. House numbers are decomposed into up to four number/letter/connector parts (`hausnrzahl1`-`hausnrzahl4`) and supplied pre-combined (`hnr_adr_zusammen`, `hnr_geb_zusammen`, `address`). Values sourced from list columns (`kgnr`, `objfunktkennziffer`) are returned comma-separated.
      type: object
      required:
        - id
        - dataset
        - country
        - country_iso
        - country_iso_2
        - language
        - address
        - line_1
        - line_2
        - latitude
        - longitude
        - adrcd
        - kgnr
        - gkz
        - okz
        - plz
        - skz
        - zaehlsprengel
        - hausnrtext
        - hausnrzahl1
        - hausnrbuchstabe1
        - hausnrverbindung1
        - hausnrzahl2
        - hausnrbuchstabe2
        - hausnrbereich
        - hnr_adr_zusammen
        - gnradresse
        - hofname
        - rw
        - hw
        - epsg
        - quelladresse
        - bestimmungsart
        - subcd
        - objektnummer
        - objfunktkennziffer
        - hauptadresse
        - hausnrverbindung2
        - hausnrzahl3
        - hausnrbuchstabe3
        - hausnrverbindung3
        - hausnrzahl4
        - hausnrbuchstabe4
        - hausnrgebaeudebez
        - hnr_geb_zusammen
        - eigenschaft
        - gemeindename
        - ortsname
        - strassenname
        - strassennamenzusatz
        - szusadrbest
        - zustellort
        - zustellort_id
        - zaehlsprengelname
      properties:
        id:
          $ref: '#/components/schemas/ID'
        dataset:
          type: string
          enum:
            - bev
        country:
          type: string
          description: |2
              Full country names (ISO 3166)
          enum:
            - Austria
        country_iso:
          type: string
          description: |2
              3 letter country code (ISO 3166-1)
          enum:
            - AUT
        country_iso_2:
          type: string
          description: |2
             2 letter country code (ISO 3166-1)
          enum:
            - AT
        language:
          type: string
          description: |
            Language represented by 2 letter ISO Code (639-1)
          enum:
            - de
        address:
          type: string
          description: |
            Complete house number: `hnr_adr_zusammen` combined with `hnr_geb_zusammen`.

            Can be empty string `""` if not present.
        line_1:
          type: string
          description: |
            First address line. The building or farmstead name (`hofname`) where one is present, otherwise the street line (street name plus `address`).

            Can be empty string `""` if not present.
        line_2:
          type: string
          description: |
            Second address line. The street line (street name plus `address`) where `line_1` holds the building name.

            Empty string `""` where the address has no building name.
        latitude:
          $ref: '#/components/schemas/Latitude'
        longitude:
          $ref: '#/components/schemas/Longitude'
        adrcd:
          type: string
          description: |
            Unique identifier of the address
        kgnr:
          type: string
          description: |
            Comma-separated cadastral numbers (Katastralgemeindenummer) of the land parcels associated with the address
        gkz:
          type: string
          description: |
            Municipality unique identifier
        okz:
          type: string
          description: |
            Locality unique identifier
        plz:
          type: string
          description: |
            Postal code
        skz:
          type: string
          description: |
            Street unique identifier
        zaehlsprengel:
          type: string
          description: |
            Census district unique identifier
        hausnrtext:
          type: string
          description: |
            Text before house number

            Can be empty string `""` if not present.
        hausnrzahl1:
          type: integer
          description: |
            House number part 1
        hausnrbuchstabe1:
          type: string
          description: |
            House letter part 1

            Can be empty string `""` if not present.
        hausnrverbindung1:
          type: string
          description: |
            House number connector 1. `-` indicates `hausnrzahl1` to `hausnrzahl2` is a range.

            Can be empty string `""` if not present.
        hausnrzahl2:
          oneOf:
            - type: string
              description: |
                Empty string `""` if not available
            - type: integer
              description: |
                House number part 2
        hausnrbuchstabe2:
          type: string
          description: |
            House letter part 2

            Can be empty string `""` if not present.
        hausnrbereich:
          type: string
          description: |
            House number range scheme (even, odd, all or not specified), as German source text
        hnr_adr_zusammen:
          type: string
          description: |
            Complete house number of the address (combination of house number parts and letters)

            Can be empty string `""` if not present.
        gnradresse:
          type: integer
          description: |
            Parcel number used as an address when no house number is present. `0` where unused.
        hofname:
          type: string
          description: |
            Name of building or building complex (e.g. farmstead), title cased

            Can be empty string `""` if not present.
        rw:
          type: string
          description: |
            Easting / X coordinate in the coordinate reference system given by `epsg`
        hw:
          type: string
          description: |
            Northing / Y coordinate in the coordinate reference system given by `epsg`
        epsg:
          type: integer
          description: |
            Coordinate reference system identifier for `rw` and `hw`
        quelladresse:
          type: string
          description: |
            Coordinate accuracy level (building level, parcel level, etc.)
        bestimmungsart:
          type: string
          description: |
            Coordinate determination method (DKM, surveying office, municipality, etc.)
        subcd:
          type: string
          description: |
            Subcode to distinguish multiple buildings at the same address
        objektnummer:
          type: string
          description: |
            Object number of the building
        objfunktkennziffer:
          type: string
          description: |
            Comma-separated building function codes for the building (e.g. `01` pharmacy, `04` fire department, `08` school, `99` no function assigned)

            Can be empty string `""` if not present.
        hauptadresse:
          type: integer
          description: |
            `1` where this is the primary address for the associated building, `0` otherwise
        hausnrverbindung2:
          type: string
          description: |
            House number connector 2

            Can be empty string `""` if not present.
        hausnrzahl3:
          oneOf:
            - type: string
              description: |
                Empty string `""` if not available
            - type: integer
              description: |
                House number part 3
        hausnrbuchstabe3:
          type: string
          description: |
            House letter part 3

            Can be empty string `""` if not present.
        hausnrverbindung3:
          type: string
          description: |
            House number connector 3

            Can be empty string `""` if not present.
        hausnrzahl4:
          oneOf:
            - type: string
              description: |
                Empty string `""` if not available
            - type: integer
              description: |
                House number part 4
        hausnrbuchstabe4:
          type: string
          description: |
            House letter part 4

            Can be empty string `""` if not present.
        hausnrgebaeudebez:
          type: string
          description: |
            Building description

            Can be empty string `""` if not present.
        hnr_geb_zusammen:
          type: string
          description: |
            Complete building designation (combination of house number and building designation)

            Can be empty string `""` if not present.
        eigenschaft:
          type: string
          description: |
            Code indicating the primary use or function of the building (e.g. `01` one apartment, `02` two or more apartments, `05` office building)
        gemeindename:
          type: string
          description: |
            Name of the municipality
        ortsname:
          type: string
          description: |
            Name of the locality
        strassenname:
          type: string
          description: |
            Name of the street
        strassennamenzusatz:
          type: string
          description: |
            Street type (e.g. "Allee", "Strasse")

            Can be empty string `""` if not present.
        szusadrbest:
          type: integer
          description: |
            Indicates whether the street type is included in the street name
        zustellort:
          type: string
          description: |
            Postal town name
        zustellort_id:
          type: string
          description: |
            Postal town identifier
        zaehlsprengelname:
          type: string
          description: |
            Name of the census district
      example:
        id: bev_5000090|001
        dataset: bev
        country: Austria
        country_iso: AUT
        country_iso_2: AT
        language: de
        address: '41'
        line_1: Poltenweg 41
        line_2: ''
        latitude: 47.240128940538256
        longitude: 11.401418155046553
        adrcd: '5000090'
        kgnr: '81134'
        gkz: '70101'
        okz: '16406'
        plz: '6080'
        skz: '001319'
        zaehlsprengel: '70101700'
        hausnrtext: ''
        hausnrzahl1: 41
        hausnrbuchstabe1: ''
        hausnrverbindung1: ''
        hausnrzahl2: ''
        hausnrbuchstabe2: ''
        hausnrbereich: keine Angabe
        hnr_adr_zusammen: '41'
        gnradresse: 0
        hofname: ''
        rw: '80893.30'
        hw: '234024.51'
        epsg: 31254
        quelladresse: G
        bestimmungsart: Z
        subcd: '001'
        objektnummer: '1330150'
        objfunktkennziffer: '99'
        hauptadresse: 1
        hausnrverbindung2: ''
        hausnrzahl3: ''
        hausnrbuchstabe3: ''
        hausnrverbindung3: ''
        hausnrzahl4: ''
        hausnrbuchstabe4: ''
        hausnrgebaeudebez: ''
        hnr_geb_zusammen: ''
        eigenschaft: '02'
        gemeindename: Innsbruck
        ortsname: Vill
        strassenname: Poltenweg
        strassennamenzusatz: ''
        szusadrbest: 0
        zustellort: Innsbruck
        zustellort_id: '15215'
        zaehlsprengelname: 70101 700
    BanAddress:

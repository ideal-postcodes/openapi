  /sign_up:
    post:
      tags:
        - Sign Up
      summary: Mint CLI Signup Token
      description: |
        Mints a one-shot `cli_token` and returns a prefilled signup URL. The user opens the URL, clears the captcha, accepts the Terms of Service and creates the account. The CLI then polls `GET /sign_up/{cli_token}` until the accounts service has propagated the new user and its first API key, at which point the API returns the credentials exactly once.

        The API does not store the `cli_token` when it mints it. The token becomes known to the API only once the accounts service propagates the new user, so the CLI must set its own polling deadline. If the user never completes signup, `GET /sign_up/{cli_token}` returns `202 Accepted` indefinitely.
      operationId: SignUpMintToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - name
                - org_name
                - org_address_line_one
                - org_post_town
                - org_postcode
                - org_country_code
              properties:
                email:
                  type: string
                  format: email
                  minLength: 1
                  description: Account holder's email address.
                name:
                  type: string
                  minLength: 1
                  description: Account holder's full name.
                org_name:
                  type: string
                  minLength: 1
                  description: Organisation name.
                org_address_line_one:
                  type: string
                  minLength: 1
                org_address_line_two:
                  type: string
                org_address_line_three:
                  type: string
                org_post_town:
                  type: string
                  minLength: 1
                org_postcode:
                  type: string
                  minLength: 1
                org_country_code:
                  type: string
                  minLength: 2
                  description: ISO 3166-1 alpha-2 country code.
      responses:
        '200':
          description: Token minted
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - result
                properties:
                  code:
                    type: integer
                    example: 2000
                  message:
                    type: string
                    example: Success
                  result:
                    type: object
                    required:
                      - cli_token
                      - signup_url
                    properties:
                      cli_token:
                        type: string
                        description: Random URL-safe token (base64url). Used by the CLI to poll for credentials.
                      signup_url:
                        type: string
                        format: uri
                        description: Prefilled accounts web URL. The user opens this in a browser to complete signup.
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

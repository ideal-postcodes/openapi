          nullable: true
          description: |
            Lambert 93 easting coordinate
        'y':
          type: string
          nullable: true
          description: |
            Lambert 93 northing coordinate
        lon:
          type: string
          nullable: true
          description: |
            Longitude (WGS84) as returned from source data
        lat:
          type: string
          nullable: true
          description: |
            Latitude (WGS84) as returned from source data
        type_position:

      title: Native Record
      description: The raw dataset record backing an address, exactly as the dataset supplies it. One schema per dataset; `dataset` on the record says which.
      oneOf:
        - $ref: '#/components/schemas/PafAddress'
        - $ref: '#/components/schemas/MrAddress'
        - $ref: '#/components/schemas/NybAddress'
        - $ref: '#/components/schemas/PafaAddress'

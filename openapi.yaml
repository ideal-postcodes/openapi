    SwtAddress:
      title: Switzerland and Liechtenstein Address
      description: |-
        An address in the Swisstopo dataset, which covers Switzerland and Liechtenstein.

        Fields are grouped by the upstream Swisstopo product they come from: the building address directory (`gebaeudeadressverzeichnis`), the street directory (`strassenverzeichnis`) and the official directory of towns and cities (`amtovz`).

        Records marked as multilingual upstream are split into one address per street name, so `language` identifies the language of the street name.
      type: object
      required:
        - id
        - dataset
        - country
        - country_iso
        - country_iso_2
        - language
        - canton
        - address
        - line_1
        - line_2
        - latitude
        - longitude
        - adr_egaid
        - str_esid
        - bdg_egid
        - adr_edid
        - stn_label
        - adr_number
        - bdg_category
        - bdg_name
        - zip_label
        - com_fosnr
        - com_name
        - com_canton
        - adr_status
        - adr_official
        - adr_modified
        - adr_easting
        - adr_northing
        - str_type
        - str_status
        - str_official
        - str_modified
        - str_easting
        - str_northing
        - ortschaftsname
        - plz4
        - zusatzziffer
        - zip_id
        - gemeindename
        - bfs_nr
        - kantonskürzel
        - sprache
        - validity
      properties:
        id:
          $ref: '#/components/schemas/ID'
        dataset:
          type: string
          enum:
            - swt
        country:
          type: string
          description: |2
              Full country names (ISO 3166)
          enum:
            - Switzerland
            - Liechtenstein
        country_iso:
          type: string
          description: |2
              3 letter country code (ISO 3166-1)
          enum:
            - CHE
            - LIE
        country_iso_2:
          type: string
          description: |2
             2 letter country code (ISO 3166-1)
          enum:
            - CH
            - LI
        language:
          type: string
          description: |
            Language represented by 2 letter ISO Code (639-1)
          enum:
            - de
            - fr
            - it
            - rm
        canton:
          type: string
          description: |
            Canton name, in the language of the address (e.g. `"Basel-Stadt"`, `"Grigioni"`, `"Grischun"`). For Liechtenstein addresses this is the district.

            Can be empty string `""` if not present.
        address:
          type: string
          description: |
            House number. Same value as `adr_number`.

            Can be empty string `""` if not present.
        line_1:
          type: string
          description: |
            First address line. The building name where present, otherwise the street name and house number.

            Can be empty string `""` if not present.
        line_2:
          type: string
          description: |
            Second address line. The street name and house number where `line_1` holds a building name.

            Can be empty string `""` if not present.
        latitude:
          $ref: '#/components/schemas/Latitude'
        longitude:
          $ref: '#/components/schemas/Longitude'
        adr_egaid:
          type: integer
          description: |
            Federal building address identifier (Eidgenössischer Gebäudeadressidentifikator).
        str_esid:
          type: integer
          description: |
            Federal street identifier (Eidgenössischer Strassenidentifikator). Joins the address to the street directory.
        bdg_egid:
          type: integer
          description: |
            Federal building identifier (Eidgenössischer Gebäudeidentifikator).
        adr_edid:
          type: integer
          description: |
            Entrance identifier within the building.
        stn_label:
          type: string
          description: |
            Street name label. For French and Italian addresses the leading street type is lowercased (e.g. `"rue de la Gare"`).
        adr_number:
          type: string
          description: |
            House/address number (e.g. `"12"`, `"12A"`).

            Can be empty string `""` if not present.
        bdg_category:
          type: string
          description: |
            Building category from the Federal Building and Dwelling Register (GWR), e.g. `"residential"`, `"non_residential"`.
        bdg_name:
          type: string
          description: |
            Building name.

            Can be empty string `""` if not present.
        zip_label:
          type: string
          description: |
            Postal code and locality label (e.g. `"8001 Zürich"`).
        com_fosnr:
          type: integer
          description: |
            Federal municipality number assigned by the Federal Statistical Office (FSO/BFS).
        com_name:
          type: string
          description: |
            Municipality name.
        com_canton:
          type: string
          description: |
            Canton abbreviation (e.g. `"ZH"`, `"BE"`).

            Can be empty string `""` if not present.
        adr_status:
          type: string
          description: |
            Address status from the GWR, e.g. `"real"`, `"projected"`.
        adr_official:
          type: boolean
          description: |
            Whether the address is an official address.
        adr_modified:
          type: string
          description: |
            Date the address record was last modified, formatted `DD.MM.YYYY`.
        adr_easting:
          type: string
          description: |
            Easting coordinate of the address in the Swiss coordinate system CH1903+/LV95 (EPSG:2056), in metres.
        adr_northing:
          type: string
          description: |
            Northing coordinate of the address in the Swiss coordinate system CH1903+/LV95 (EPSG:2056), in metres.
        str_type:
          type: string
          description: |
            Street type, e.g. `"Street"`, `"Area"`.
        str_status:
          type: string
          description: |
            Street status, e.g. `"real"`, `"projected"`.
        str_official:
          type: boolean
          description: |
            Whether the street name is official.
        str_modified:
          type: string
          description: |
            Date the street record was last modified, formatted `DD.MM.YYYY`.
        str_easting:
          type: string
          description: |
            Easting coordinate of the street centroid in the Swiss coordinate system CH1903+/LV95 (EPSG:2056), in metres.
        str_northing:
          type: string
          description: |
            Northing coordinate of the street centroid in the Swiss coordinate system CH1903+/LV95 (EPSG:2056), in metres.
        ortschaftsname:
          type: string
          description: |
            Locality name from the Official Directory of Towns and Cities (Amtliches Ortschaftenverzeichnis).

            Can be empty string `""` if the address does not match a locality record.
        plz4:
          type: string
          description: |
            4-digit Swiss postal code, zero padded.

            Can be empty string `""` if the address does not match a locality record.
        zusatzziffer:
          type: string
          nullable: true
          description: |
            2-digit supplementary code distinguishing localities that share a 4-digit postal code.

            `null` if the address does not match a locality record.
        zip_id:
          type: integer
          nullable: true
          description: |
            Unique identifier for the postal code record.

            `null` if the address does not match a locality record.
        gemeindename:
          type: string
          nullable: true
          description: |
            Municipality name (Gemeindename) from the locality directory.

            `null` if the address does not match a locality record.
        bfs_nr:
          type: integer
          nullable: true
          description: |
            Federal municipality number assigned by the Federal Statistical Office (BFS-Nr).

            `null` if the address does not match a locality record.
        kantonskürzel:
          type: string
          description: |
            Canton abbreviation from the locality directory (e.g. `"ZH"`, `"GE"`).

            Can be empty string `""` if not present.
        sprache:
          type: string
          nullable: true
          description: |
            Language of the address, mirroring `language`.
        validity:
          type: string
          nullable: true
          description: |
            Date the postal code record became valid, formatted `YYYY-MM-DD`.
      example:
        id: swt_102410972|de
        dataset: swt
        country: Switzerland
        country_iso: CHE
        country_iso_2: CH
        language: de
        canton: Basel-Stadt
        address: '15.1'
        line_1: Brohegasse 15.1
        line_2: ''
        latitude: 47.571268381201655
        longitude: 7.663107983521497
        adr_egaid: 102410972
        str_esid: 10025136
        bdg_egid: 243057973
        adr_edid: 0
        stn_label: Brohegasse
        adr_number: '15.1'
        bdg_category: non_residential
        bdg_name: ''
        zip_label: 4126 Bettingen
        com_fosnr: 2702
        com_name: Bettingen
        com_canton: BS
        adr_status: real
        adr_official: false
        adr_modified: 23.07.2024
        adr_easting: '2616891.820'
        adr_northing: '1268975.560'
        str_type: Street
        str_status: real
        str_official: true
        str_modified: 23.07.2024
        str_easting: '2616922.086'
        str_northing: '1268999.001'
        ortschaftsname: Bettingen
        plz4: '4126'
        zusatzziffer: '00'
        zip_id: 2531
        gemeindename: Bettingen
        bfs_nr: 2702
        kantonskürzel: BS
        sprache: de
        validity: '2008-07-01'
    AddressListItem:
      title: Address (list endpoints)
      description: |-
        A single address, as returned by the postcode and address list endpoints. Every other endpoint returns `Address`, the same set of fields with `native` on every record.

        The standard Ideal Postcodes address. Its fields follow the layout UK address databases typically use, and much of it reflects Royal Mail's Postcode Address File, the UK's primary address database.

        The API converts non-UK addresses into the same UK layout so they insert into a standard address database.

        Pay attention to the address lines (`line_1`, `line_2` and `line_3`), post town, postcode, county and country. Together they are all you need to identify an address uniquely, in the UK or as an international address.

        For international addresses, cities map to `post_town` and states map to `county`.

        Addresses from AddressBase (`ab`, `abp`) and non-UK datasets also carry a `native` object: the raw record from its source dataset, with local detail the standard fields cannot hold. It is never returned for the Royal Mail PAF family (`paf`, `mr`, `nyb`, `pafa`, `pafw`) on these two endpoints. E.g.

        - ECAD records say whether an address sits in a Gaeltacht (Irish-speaking) district and whether the building is residential or commercial
        - USPS records carry the carrier route and congressional district
        - Kadaster records carry the floor area, year of completion and use (residential, office, retail)
      example:
        id: paf_23747771
        dataset: paf
        country_iso: GBR
        country_iso_2: GB
        country: England
        language: en
        postcode: SW1A 2AA
        postcode_inward: 2AA
        postcode_outward: SW1A
        post_town: London
        dependant_locality: ''
        double_dependant_locality: ''
        thoroughfare: Downing Street
        dependant_thoroughfare: ''
        building_number: '10'
        building_name: ''
        sub_building_name: ''
        po_box: ''
        department_name: ''
        organisation_name: Prime Minister & First Lord Of The Treasury
        udprn: 23747771
        umprn: ''
        uprn: '100023336956'
        postcode_type: S
        su_organisation_indicator: ''
        delivery_point_suffix: 1A
        line_1: Prime Minister & First Lord Of The Treasury
        line_2: 10 Downing Street
        line_3: ''
        premise: '10'
        longitude: -0.12767
        latitude: 51.503541
        eastings: 530047
        northings: 179951
        county: London
        county_code: ''
        traditional_county: Greater London
        administrative_county: ''
        postal_county: London
        district: Westminster
        ward: St. James's
      type: object
      required:
        - postcode
        - postcode_outward
        - postcode_inward
        - post_town
        - dependant_locality
        - double_dependant_locality
        - thoroughfare
        - dependant_thoroughfare
        - building_number
        - building_name
        - sub_building_name
        - po_box
        - department_name
        - organisation_name
        - udprn
        - umprn
        - postcode_type
        - su_organisation_indicator
        - delivery_point_suffix
        - line_1
        - line_2
        - line_3
        - premise
        - country
        - administrative_county
        - postal_county
        - traditional_county
        - district
        - ward
        - longitude
        - latitude
        - eastings
        - northings
        - uprn
        - county
        - county_code
        - id
        - dataset
        - country_iso
        - country_iso_2
        - language
      properties:
        id:
          $ref: '#/components/schemas/ID'
        dataset:
          $ref: '#/components/schemas/Dataset'
        country_iso:
          $ref: '#/components/schemas/CountryISO'
        country_iso_2:
          $ref: '#/components/schemas/CountryISO2'
        country:
          $ref: '#/components/schemas/Country'
        language:
          $ref: '#/components/schemas/Language'
        line_1:
          title: Line 1
          type: string
          description: First address line. Often contains premise and thoroughfare information. For a commercial premise the first line is the full name of the registered organisation. Never empty.
        line_2:
          title: Line 2
          type: string
          description: Second address line. Often contains thoroughfare and locality information. May be empty.
        line_3:
          title: Line 3
          type: string
          description: Third address line. Takes the address elements left after `line_1` and `line_2` are filled; where the address needs more than three lines the remaining elements are joined into `line_3`, comma separated. May be empty.
        post_town:
          title: Post Town
          type: string
          description: The town or city used to route mail to the address. For UK addresses this is the Royal Mail post town, which is a routing instruction rather than the nearest town geographically. Present on every address.
        postcode:
          title: Postcode
          type: string
          description: Correctly formatted postcode. Capitalised and spaced. Empty (`""`) where the address has no postcode.
        county:
          title: County
          type: string
          description: Whatever county data is available for the address. Normally the postal county. If that is not present it falls back to the administrative county, then to the traditional county. May be empty where none of the three is present.
        county_code:
          title: County Code
          type: string
          description: Short code representing the county or province. May be empty (`""`)
        uprn:
          title: Unique Property Reference Number
          type: string
          description: |-
            UPRN stands for Unique Property Reference Number and is maintained by the Ordnance Survey (OS). Local governments in the UK have allocated a unique number for each land or property.

            Up to 12 digits in length.

            Multiple Residence premises currently share the same UPRN as the parent premise.

            May not be available for a small number of Great Britain addresses due to longer update cycles for Ordnance Survey's AddressBase datasets. Returns empty string "" in these instances, as it does for addresses outside the UK.

            Although UPRN takes an integer format, we encode and transmit this data as strings. As a 12 digit number, the UPRN can exceed the maximum safe integer `Number.MAX_SAFE_INTEGER` in most browsers causing this datapoint to be corrupted.

            Take special care when storing UPRN. As a 12 digit identifier, you will need 64 bits to encode every possible UPRN value. This means applications like Excel will corrupt cells containing UPRN values.
        udprn:
          title: Unique Delivery Point Reference Number (UDPRN)
          description: |-
            UDPRN stands for 'Unique Delivery Point Reference Number'. Royal Mail assigns a unique UDPRN code for each premise on PAF. Simple, unique reference number for each Delivery Point. Unlikely to be reused when an address expires.

            Up to 8-digit numeric code. A new UDPRN is automatically assigned to each new Delivery Point added to PAF.

            Returns `0` on a UK dataset that carries no UDPRN for the address, and an empty string `""` on a non-UK address. Use `id` for an identifier present on every address.
          oneOf:
            - type: integer
              format: int32
              description: UDPRN of the delivery point. `0` where none is available
            - type: string
              description: Empty string `""` for non-UK addresses
              enum:
                - ''
        umprn:
          title: UMPRN
          description: |-
            A small minority of individual premises (as identified by a UDPRN) may have multiple occupants behind the same letterbox. These are known as Multiple Residence occupants and can be queried via the Multiple Residence dataset. Simple, unique reference number for each Multiple Residence occupant.

            Note: this will be an empty string `""` when not used.
          oneOf:
            - type: string
              description: If premise is not multiple occupancy, this will be an empty string
            - type: number
              description: If premise is multiple occupancy, this will be an integer
              minimum: 0
              maximum: 99999999
        postcode_outward:
          title: Postcode Outward
          type: string
          description: |-
            The first part of a postcode is known as the outward code. e.g. The outward code of ID1 1QD is ID1. Enables mail to be sorted to the correct local area for delivery. This part of the code contains the area and the district to which the mail is to be delivered, e.g. 'PO1', 'SW1A' or 'B23'.

            Empty (`""`) where the address has no UK postcode.
        postcode_inward:
          title: Postcode Inward
          type: string
          description: |-
            The second part of a postcode is known as the inward code. e.g. The inward code of ID1 1QD is 1QD.

            The number identifies the sector in the postal district. The number is followed by 2 letters. The letters then define one or more properties in that sector.

            Empty (`""`) where the address has no UK postcode.
        dependant_locality:
          title: Dependant Locality
          type: string
          description: A locality that qualifies the thoroughfare. Used where the same thoroughfare name occurs more than once in a post town and no dependant thoroughfare distinguishes them. May be empty.
        double_dependant_locality:
          title: Double Dependant Locality
          type: string
          description: Supplements dependant locality. Supplied where the dependant locality itself occurs twice in the same locality. May be empty.
        thoroughfare:
          title: Thoroughfare
          type: string
          description: Also known as the street or road name. May be empty.
        dependant_thoroughfare:
          title: Dependant Thoroughfare
          type: string
          description: Supplements thoroughfare. Used where a thoroughfare name occurs twice in the same post town, to identify the address uniquely. May be empty.
        building_number:
          title: Building Number
          type: string
          description: Number identifying the premise on a thoroughfare or dependant thoroughfare. May be empty.
        building_name:
          title: Building Name
          type: string
          description: |-
            Name of a residential or commercial premise. May be empty.

            Examples:
              - The Manor
              - 1-2
              - A
              - 12A
              - K
              - Victoria House
        sub_building_name:
          title: Sub-Building Name
          type: string
          description: Identifies a unit where a premise is split into flats, apartments or business units. Cannot be present without either building_name or building_number. E.g. Flat 1, A, 10B. May be empty.
        po_box:
          title: PO Box
          type: string
          description: PO Box number for the address, occasionally a combination of numbers and letters. Allocated to Large User postcodes only. May be empty.
        department_name:
          title: Department Name
          type: string
          description: Supplements organisation name to identify a department within the organisation. May be empty.
        organisation_name:
          title: Organisation Name
          type: string
          description: Name of the business or organisation at this address. May be empty.
        postcode_type:
          title: Postcode Type
          description: |-
            Royal Mail postcode user type. UK addresses only.

              - `S` small user. The postcode identifies a group of delivery points. There are on average 19 delivery points per postcode, and never more than 100
              - `L` large user. The postcode is assigned to a single address, either because of the volume of mail it receives or because a PO Box or Selectapost service is set up

            Empty (`""`) where not applicable.
          enum:
            - S
            - L
            - ''
        su_organisation_indicator:
          title: Small User Organisation Indicator
          type: string
          description: '`Y` where an organisation is present at a small user postcode. Empty (`""`) otherwise. UK addresses only.'
        delivery_point_suffix:
          title: Delivery Point Suffix
          type: string
          description: Two-character code (the first numeric, the second alphabetical) which, added to the postcode, uniquely identifies a delivery point. May be reused once a delivery point is deleted, though not until every remaining code in the range has been allocated. Always `1A` for a large user postcode, since each large user has its own postcode. Empty (`""`) where not available.
        premise:
          title: Premise
          type: string
          description: A pre-computed string which sensibly combines building_number, building_name and sub_building_name. Those three fields hold raw dataset values and can be difficult to parse if you are unaware of how they work together, so we also provide this single, simple premise string. Ideal if you want to pull premise information and thoroughfare information separately instead of using our address lines data.
        administrative_county:
          title: Administrative County
          type: string
          description: |-
            The current administrative county to which the postcode has been assigned.

            A Unitary Authority name, where one is present. If there is no Unitary Authority, the County name is used. This information is not static, because County boundaries may change due to administrative changes.

            Source: ONS. May be empty.
        postal_county:
          title: Postal County
          type: string
          description: Postal counties were used for the distribution of mail before the Postcode system was introduced in the 1970s. The Former Postal County was the Administrative County at the time. This data rarely changes. May be empty.
        traditional_county:
          title: Traditional County
          type: string
          description: Traditional counties are provided by the Association of British Counties. It is historical data, and can date from the 1800s. May be empty.
        district:
          title: District
          type: string
          description: The current district/unitary authority to which the postcode has been assigned. May be empty.
        ward:
          title: Ward
          type: string
          description: The current administrative/electoral area to which the postcode has been assigned. May be empty for a small number of addresses.
        longitude:
          $ref: '#/components/schemas/Longitude'
        latitude:
          $ref: '#/components/schemas/Latitude'
        eastings:
          $ref: '#/components/schemas/Eastings'
        northings:
          $ref: '#/components/schemas/Northings'
        native:
          description: |
            The raw dataset record backing this address. On these two endpoints it is returned for AddressBase (`ab`, `abp`) and non-UK datasets only, never for the PAF family. Use any other endpoint for a PAF native record.
          oneOf:
            - $ref: '#/components/schemas/AbAddress'
            - $ref: '#/components/schemas/AbpAddress'
            - $ref: '#/components/schemas/UspsAddress'
            - $ref: '#/components/schemas/EcadAddress'
            - $ref: '#/components/schemas/EcafAddress'
            - $ref: '#/components/schemas/HereAddress'
            - $ref: '#/components/schemas/GnafAddress'
            - $ref: '#/components/schemas/KadasterAddress'
            - $ref: '#/components/schemas/KartverketAddress'
            - $ref: '#/components/schemas/SdfiAddress'
            - $ref: '#/components/schemas/CannarAddress'
            - $ref: '#/components/schemas/FodbosaAddress'
            - $ref: '#/components/schemas/MoisAddress'
            - $ref: '#/components/schemas/UpujpAddress'
            - $ref: '#/components/schemas/BevAddress'
            - $ref: '#/components/schemas/BanAddress'
            - $ref: '#/components/schemas/SwtAddress'
    PostcodeResponse:
      title: Postcode Response
      type: object
      required:
        - message
        - code
        - result
        - limit
        - page
        - total
      properties:
        result:
          type: array
          items:
            $ref: '#/components/schemas/AddressListItem'
          description: |
            All addresses listed at the postcode.

            If Eircode is enabled, addresses for the Republic of Ireland will be returned in the English format.
        code:
          type: integer
          enum:
            - 2000
        message:
          type: string
          enum:
            - Success
        page:
          type: integer
          minimum: 0
          maximum: 10
          default: 0
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 100
        total:
          type: integer
    PostcodeNotFoundResponse:
      title: Postcode Not Found
      type: object
      required:
        - message
        - code
        - suggestions
      properties:
        code:
          type: integer
          format: int32
          enum:
            - 4040
        message:
          type: string
          enum:
            - Postcode not found
        suggestions:
          description: A list of alternate nearest matching postcodes you can try
          type: array
          items:
            type: string
            example: SN13 0SF
    PafRecordBase:
      title: PAF Native Record (Base)
      description: |-
        Fields shared by every Royal Mail PAF family native record (`paf`, `mr`, `nyb`, `pafa`, `pafw`).

        The Royal Mail record as held in Postgres, before any derived fields are added. Formatted lines, `premise`, postcode parts, geocodes, UPRN and county fields belong to the address, not to the native record. `dataset` is the one field not taken from Royal Mail.

        Two values differ from the raw PAF file: `post_town` is title cased (Royal Mail supplies it upper cased), and a `building_number` of `0`, PAF's sentinel for "none", is returned as an empty string.
      type: object
      required:
        - dataset
        - postcode
        - post_town
        - dependant_locality
        - double_dependant_locality
        - thoroughfare
        - dependant_thoroughfare
        - building_number
        - building_name
        - sub_building_name
        - department_name
        - organisation_name
        - udprn
        - postcode_type
        - su_organisation_indicator
        - delivery_point_suffix
      properties:
        dataset:
          type: string
          description: Dataset the record belongs to. The only field not taken from the Royal Mail record
        postcode:
          type: string
          maxLength: 8
          minLength: 6
          description: Postcode, space separated
        post_town:
          type: string
          maxLength: 30
          description: Royal Mail post town, title cased
        dependant_locality:
          type: string
          maxLength: 35
          description: Dependant locality. Empty string when not present
        double_dependant_locality:
          type: string
          maxLength: 35
          description: Double dependant locality. Empty string when not present
        thoroughfare:
          type: string
          maxLength: 80
          description: Street name
        dependant_thoroughfare:
          type: string
          maxLength: 80
          description: Dependant street name. Empty string when not present
        building_number:
          type: string
          maxLength: 4
          description: Building number. Empty string when not present, or when PAF merges it into the building name
        building_name:
          type: string
          maxLength: 50
          description: Building name. Empty string when not present
        sub_building_name:
          type: string
          maxLength: 30
          description: Sub building name. Empty string when not present
        department_name:
          type: string
          maxLength: 60
          description: Department name within an organisation. Empty string when not present
        organisation_name:
          type: string
          maxLength: 60
          description: Organisation name. Empty string when not present
        udprn:
          type: integer
          description: Unique Delivery Point Reference Number
        postcode_type:
          type: string
          description: |
            Postcode type.

              - `S` Small user
              - `L` Large user
              - `""` where Royal Mail supplies none
          enum:
            - S
            - L
            - ''
        su_organisation_indicator:
          type: string
          maxLength: 1
          description: Small user organisation indicator. `Y` where the small user postcode is held by an organisation
        delivery_point_suffix:
          type: string
          maxLength: 2
          description: Royal Mail delivery point suffix
      example:
        dataset: paf
        postcode: SW1A 2AA
        post_town: London
        dependant_locality: ''
        double_dependant_locality: ''
        thoroughfare: Downing Street
        dependant_thoroughfare: ''
        building_number: '10'
        building_name: ''
        sub_building_name: ''
        department_name: ''
        organisation_name: Prime Minister & First Lord Of The Treasury
        udprn: 23747771
        postcode_type: S
        su_organisation_indicator: ''
        delivery_point_suffix: 1A
    PafAddress:
      title: Royal Mail Postcode Address File Address
      description: Raw Royal Mail Postcode Address File record backing a `paf` address.
      allOf:
        - $ref: '#/components/schemas/PafRecordBase'
        - type: object
          required:
            - po_box
          properties:
            po_box:
              type: string
              maxLength: 6
              description: PO Box number. Empty string when not present
            dataset:
              type: string
              enum:
                - paf
      example:
        dataset: paf
        postcode: SW1A 2AA
        post_town: London
        dependant_locality: ''
        double_dependant_locality: ''
        thoroughfare: Downing Street
        dependant_thoroughfare: ''
        building_number: '10'
        building_name: ''
        sub_building_name: ''
        po_box: ''
        department_name: ''
        organisation_name: Prime Minister & First Lord Of The Treasury
        udprn: 23747771
        postcode_type: S
        su_organisation_indicator: ''
        delivery_point_suffix: 1A
    MrAddress:
      title: Multiple Residence Address
      description: |-
        Raw Royal Mail Multiple Residence record backing an `mr` address.

        Multiple Residence holds sub-premises (flats, rooms) that share a parent PAF delivery point. `umprn` keys the residence, `udprn` the parent delivery point. The record has no `po_box`.
      allOf:
        - $ref: '#/components/schemas/PafRecordBase'
        - type: object
          required:
            - umprn
          properties:
            dataset:
              type: string
              enum:
                - mr
            umprn:
              type: integer
              description: Unique Multiple Residence Reference Number
      example:
        dataset: mr
        postcode: SW1A 2AA
        post_town: London
        dependant_locality: ''
        double_dependant_locality: ''
        thoroughfare: Downing Street
        dependant_thoroughfare: ''
        building_number: '10'
        building_name: ''
        sub_building_name: Flat 1
        department_name: ''
        organisation_name: ''
        udprn: 23747771

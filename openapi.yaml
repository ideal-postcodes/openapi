    GeonamesPlace:
      title: GeoNames Place
      description: |-
        The GeoNames record backing a place, as indexed.

        Only administrative divisions (feature class `A`) and capital or seat-of-administration cities (feature codes `PPLC` and `PPLA*`) are indexed. Historical features (feature codes ending in `H`) are excluded.
      type: object
      required:
        - id
        - dataset
        - geonameid
        - name
        - asciiname
        - alternatenames
        - language
        - latitude
        - longitude
        - feature_class
        - feature_code
        - country_code
        - country_iso
        - cc2
        - admin1_name
        - admin1_geonameid
        - admin1_code
        - admin2_name
        - admin2_geonameid
        - admin2_code
        - admin3_code
        - admin4_code
        - population
        - elevation
        - dem
        - timezone
        - modification_date
      properties:
        id:
          type: string
          description: Unique place ID
        dataset:
          type: string
          description: Indicates the provenance of a place
          enum:
            - geonames
        geonameid:
          type: integer
          format: int32
          description: Unique identifier for GeoNames place
        name:
          type: string
          description: Place name (UTF8)
          minLength: 0
          maxLength: 200
        asciiname:
          type: string
          description: Place name (ASCII). Empty string if not available
          minLength: 0
          maxLength: 200
        alternatenames:
          type: array
          description: List of alternate names for the place
          items:
            type: string
            description: Alternate name for place
        language:
          $ref: '#/components/schemas/Language'
        latitude:
          $ref: '#/components/schemas/Latitude'
        longitude:
          $ref: '#/components/schemas/Longitude'
        feature_class:
          type: string
          description: |-
            GeoNames single letter feature class (http://www.geonames.org/export/codes.html). Only two are indexed

              - `A` Country, state, region
              - `P` City, village
          enum:
            - A
            - P
        feature_code:
          type: string
          description: Full GeoNames feature code (http://www.geonames.org/export/codes.html)
          minLength: 0
          maxLength: 10
        country_code:
          type: string
          description: 2 letter ISO country code. Empty string if not available
          minLength: 0
          maxLength: 2
        country_iso:
          type: string
          description: 3 letter ISO country code derived from `country_code`. Empty string if the country cannot be resolved
          minLength: 0
          maxLength: 3
        cc2:
          type: array
          description: List of other country codes mapping to this place
          items:
            type: string
            description: 2 letter ISO country code
            minLength: 2
            maxLength: 2
        admin1_name:
          type: string
          description: Name of first administrative area. Empty string if not available
        admin1_geonameid:
          type: integer
          format: int32
          nullable: true
          description: GeoName ID for first administrative area
        admin1_code:
          type: string
          description: Fipscode (subject to change to iso code)
          minLength: 0
          maxLength: 20
        admin2_name:
          type: string
          description: Name of second administrative area. Empty string if not available
        admin2_geonameid:
          type: integer
          format: int32
          nullable: true
          description: GeoName ID for second administrative area
        admin2_code:
          type: string
          description: Code for the second administrative division
          minLength: 0
          maxLength: 101
        admin3_code:
          type: string
          description: Code for third level administrative division
          minLength: 0
          maxLength: 122
        admin4_code:
          type: string
          description: Code for fourth level administrative division
          minLength: 0
          maxLength: 143
        population:
          type: string
          description: Population at place. Represented as a string as it can be larger than a 32 bit integer
        elevation:
          type: integer
          format: int32
          nullable: true
          description: Elevation in metres. `null` if not available
        dem:
          type: integer
          format: int32
          nullable: true
          description: Digital elevation model (srtm3 or gtopo30), average elevation in metres
        timezone:
          type: string
          description: The IANA timezone ID. Empty string if not available
          minLength: 0
          maxLength: 40
        modification_date:
          type: string
          format: date-time
          description: Date the GeoNames record was last modified
      example:
        id: geonames_7296662
        dataset: geonames
        geonameid: 7296662
        name: Strumpshaw
        asciiname: Strumpshaw
        alternatenames: []
        language: en
        latitude: 52.60599
        longitude: 1.47572
        feature_class: A
        feature_code: ADM4
        country_code: GB
        country_iso: GBR
        cc2: []
        admin1_name: England
        admin1_geonameid: 6269131
        admin1_code: ENG
        admin2_name: Norfolk
        admin2_geonameid: 2641455
        admin2_code: I9
        admin3_code: 33UC
        admin4_code: 33UC056
        population: '0'
        elevation: null
        dem: 25
        timezone: Europe/London
        modification_date: '2010-05-25T00:00:00.000Z'
    Place:
      title: Place
      description: |
        A geographical place: an administrative division, capital or seat of administration city drawn from GeoNames. `GET /places` returns a suggestion for each match and `GET /places/{place}` resolves a suggestion id to the full place. `native` holds the underlying GeoNames record.
      type: object
      required:
        - id
        - dataset
        - name
        - descriptive_name
        - country_iso
        - language
        - longitude
        - latitude
        - native
      properties:
        id:
          title: Place Identifier
          type: string
          description: Global unique internally generated identifier for a place
        dataset:
          title: Dataset
          type: string
          description: Indicates the provenance of a place.
          enum:
            - geonames
        name:
          $ref: '#/components/schemas/place_name'
        descriptive_name:
          $ref: '#/components/schemas/place_descriptive_name'
        country_iso:
          $ref: '#/components/schemas/place_country_iso'
        language:
          $ref: '#/components/schemas/Language'
        longitude:
          $ref: '#/components/schemas/Longitude'
        latitude:
          $ref: '#/components/schemas/Latitude'
        native:
          description: Native representation of a place
          oneOf:
            - $ref: '#/components/schemas/GeonamesPlace'
      example:
        id: geonames_7296662
        dataset: geonames
        name: Strumpshaw
        descriptive_name: Strumpshaw, Norfolk, England
        country_iso: GBR
        language: en
        longitude: 1.47572
        latitude: 52.60599
        native:
          id: geonames_7296662
          dataset: geonames
          geonameid: 7296662
          name: Strumpshaw
          asciiname: Strumpshaw
          alternatenames: []
          language: en
          latitude: 52.60599
          longitude: 1.47572
          feature_class: A
          feature_code: ADM4
          country_code: GB
          country_iso: GBR
          cc2: []
          admin1_name: England
          admin1_geonameid: 6269131
          admin1_code: ENG
          admin2_name: Norfolk
          admin2_geonameid: 2641455
          admin2_code: I9
          admin3_code: 33UC
          admin4_code: 33UC056
          population: '0'
          elevation: null
          dem: 25
          timezone: Europe/London
          modification_date: '2010-05-25T00:00:00.000Z'
    ResolvePlaceResponse:
      title: Place Resolution Response
      type: object
      required:
        - message
        - code
        - result
      properties:
        code:
          type: integer
          format: int32
          enum:
            - 2000
        message:
          type: string
          enum:
            - Success
        result:
          $ref: '#/components/schemas/Place'
    LicenseeEditable:
      title: Licensee
      description: Licensee object which can be defined by user
      type: object
      properties:
        name:
          type: string
          example: Qwerty Widgets Limited
          description: Licensee individual or organisation name
        address:
          example: 12 High Street, Manchester
          type: string
          description: Licensee's first, second and third line address as well as post town concatenated by commas
        postcode:
          example: ID1 1QD
          type: string
          description: Licensee's postcode
        whitelist:
          type: array
          items:
            type: string
            example: https://www.example.com
          description: A list of allowed URLs. An empty list means that whitelisting is disabled
        daily:
          type: object
          properties:
            limit:
              example: 10000
              x-nullable: true
              nullable: true
              minimum: 0
              format: int32
              type: number
              description: The maximum number of lookups this licensee can perform in a day. `null` indicates the limit is not active
    Licensee:
      title: Licensee
      allOf:
        - $ref: '#/components/schemas/LicenseeEditable'
        - type: object
          required:
            - id
            - key
            - createdAt
            - name
            - address
            - postcode
            - whitelist
            - daily
          properties:
            id:
              type: string
              example: 56a11209ebe230380bf104c3
              description: |
                An immutable ID provided for every licensee. Primarily used for paginated list requests.
            key:
              type: string
              example: sl_ijoiqsxeQgXW2gkiE0X94
              description: |
                Uniquely identifies a licensee for a key. 

                Required to perform paid lookups for a specific licensee. Typically begins `sk_`.
            createdAt:
              type: string
              example: '2016-01-21T17:14:49.971Z'
              description: Timestamp for when the licensee was created
            daily:
              required:
                - count
                - updatedAt
              type: object
              properties:
                count:
                  example: 232
                  minimum: 0
                  type: number
                  format: int32
                  description: The number lookups performed by the licensee on the day represented b `licesees.daily.updatedAt`
                updatedAt:
                  type: string
                  example: '2016-08-05T16:43:28.865Z'
                  description: The timestamp when the limit was last used.
    LicenseesResponse:
      title: Licensee List Response
      type: object
      required:
        - message
        - code
        - result
      properties:
        result:
          description: List of licensees
          type: object
          properties:
            licensees:
              type: array
              items:
                $ref: '#/components/schemas/Licensee'
            hasMore:
              type: boolean
              description: Returns true if there are more licensees listed after the maximum number of results as implied by `limit`
        message:
          type: string
          enum:
            - Success
        code:
          type: integer
          format: int32
          enum:
            - 2000
    LicenseeResponse:
      title: Licensee Response
      type: object
      required:
        - message
        - code
        - result
      properties:
        result:
          $ref: '#/components/schemas/Licensee'
        code:
          type: integer
          format: int32
          enum:
            - 2000
        message:
          type: string
          enum:
            - Success
    Config:
      title: Config Object
      type: object
      required:
        - updatedAt
        - createdAt
        - name
        - payload
      properties:
        updatedAt:
          type: string
          example: '2016-01-21T17:14:49.971Z'
          description: Timestamp for when the config was created
        createdAt:
          type: string
          example: '2016-01-21T17:14:49.971Z'
          description: Timestamp for when the config was updated
        name:

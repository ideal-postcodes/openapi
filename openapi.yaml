        street_end_long:
          title: Street End Longitude
          type: number
          format: double
          nullable: true
          description: Longitude (ETRS89) for the street end point.
        street_tolerance:
          title: Street Tolerance
          type: integer
          nullable: true
          description: Accuracy of street-coordinate data capture, in metres.
        street_description:
          title: Street Description
          type: string
          maxLength: 100
          nullable: true
          description: Street name, description or street number.
        street_locality:
          title: Street Locality
          type: string
          maxLength: 35
          nullable: true
          description: Geographical area within a town.
        street_town:
          title: Street Town
          type: string
          maxLength: 30
          nullable: true
          description: |
            Name of the town. Required for Street Record Types `1` and `2`;
            optional for types `3`, `4` and `9`.
        adminstrative_area:
          title: Administrative Area
          type: string
          maxLength: 30
          nullable: true
          description: |
            Local Highway Authority name (administrative area / county / unitary
            authority). Field name spelling preserved verbatim from OS

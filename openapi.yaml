    AbAddress:
      title: AddressBase Core Address
      description: |
        An address from Ordnance Survey's AddressBase Core, a flat cut of the approved addresses in Great Britain. Each record is one UPRN drawn from the local authority gazetteers: the National Land and Property Gazetteer for England and Wales, the One Scotland Address Gazetteer for Scotland. It carries the Royal Mail delivery point where one has been matched, property level coordinates, a classification (`classification_code`), the key identifiers (`uprn`, `parent_uprn`, `udprn`, `usrn`, `toid`), the contributing authority (`gss_code`), coordinate quality (`rpc`) and the change the latest supply applied (`change_code`). Ordnance Survey publishes around 35 million records and refreshes them weekly.

        How it differs from the neighbouring datasets:

        - **AddressBase Premium** (`abp`) is the full gazetteer: around 40 million UPRNs including historic and provisional records, the local authority address breakdown (`pao_*`, `sao_*`), lifecycle (`logical_status`, `blpu_state`), Welsh alternatives, the street record and cross references to the Valuation Office Agency and ONS, refreshed every six weeks. AddressBase Core carries none of these. Use it when one approved address per UPRN, with coordinates and a classification, is enough.
        - **Royal Mail PAF** (`paf`) lists delivery points only, keyed by UDPRN. AddressBase Core keys on UPRN and also holds non-postal objects (substations, car parks, land parcels, parent shells) with no delivery point. On those records `udprn` is `0` and `delivery_point_suffix` is empty. Where a record matches PAF, `ab` renders the same `line_1` to `line_3` as `paf` for that UDPRN, bar a handful of records with a trailing range in the building name, which AddressBase Core keeps whole.
        - The Ordnance Survey end of life notice for autumn 2027 covers AddressBase and AddressBase Plus, not AddressBase Core.
      type: object
      required:
        - id
        - country_iso
        - dataset
        - language
        - line_1
        - line_2
        - line_3
        - premise
        - uprn
        - udprn
        - parent_uprn
        - usrn
        - toid
        - classification_code
        - eastings
        - northings
        - latitude
        - longitude
        - single_address_line
        - street_name
        - locality
        - town_name
        - delivery_point_suffix
        - post_town
        - gss_code
        - rpc
        - last_update_date
        - island
        - change_code
        - building_name
        - building_number
        - sub_building
        - postcode
        - po_box
        - organisation
        - country
        - county
        - district
        - ward
        - traditional_county
        - administrative_county
        - postal_county
      properties:
        id:
          $ref: '#/components/schemas/ID'
        country_iso:
          title: ISO Country Code (3)
          type: string
          description: |2
              3 letter country code (ISO 3166-1)
        dataset:
          title: Dataset
          type: string
          description: Indicates the provenance of an address
          enum:
            - ab
        language:
          $ref: '#/components/schemas/Language'
        line_1:
          title: Line 1
          type: string
          description: First Address Line. Often contains premise and thoroughfare information. In the case of a commercial premise, the first line is always the full name of the registered organisation. Never empty.
        line_2:
          title: Line 2
          type: string
          description: Second Address Line. Often contains thoroughfare and locality information. May be empty
        line_3:
          title: Line 3
          type: string
          description: Third address line. Takes the address elements left after `line_1` and `line_2` are filled; where the address needs more than three lines the remaining elements are joined into `line_3`, comma separated. May be empty.
        premise:
          title: Premise
          type: string
          description: A pre-computed string which sensibly combines the building name, sub-building and building number fields into a single, simple premise string. Ideal if you want to pull premise information and thoroughfare information separately instead of using the address lines.
        uprn:
          title: UPRN
          type: string
          maxLength: 16
          description: Unique Property Reference Number (UPRN) assigned by the LLPG Custodian or Ordnance Survey.
        udprn:
          title: UDPRN
          type: integer
          description: Royal Mail's Unique Delivery Point Reference Number (UDPRN). `0` where the record has no matching PAF delivery point.
        parent_uprn:
          title: PARENT_UPRN
          type: string
          maxLength: 16
          description: UPRN of the parent record where a parent-child relationship exists. Empty where the record has no parent.
        usrn:
          title: USRN
          type: integer
          description: Unique Street Reference Number assigned by the Street Name and Numbering Custodian or by Ordnance Survey, depending on the address record.
        toid:
          title: TOID
          type: string
          maxLength: 20
          description: The Topographic Identifier taken from OS MasterMap Topography Layer. This TOID is assigned to the UPRN by performing a spatial intersection between the two identifiers. It consists of the letters 'osgb' followed by up to sixteen digits. May be empty.
        classification_code:
          title: Classification Code
          type: string
          maxLength: 4
          description: A code that describes the classification of the address record to a maximum of a secondary level. The first letter is the primary class (e.g. `R` residential, `C` commercial, `L` land), the second the secondary class (e.g. `RD` dwelling).
        eastings:
          title: Easting
          type: number
          description: A value in metres defining the x location in accordance with the British National Grid.
        northings:
          title: Northing
          type: number
          description: A value in metres defining the y location in accordance with the British National Grid.
        latitude:
          title: Latitude
          type: number
          description: A value defining the Latitude location in accordance with the ETRS89 coordinate reference system.
        longitude:
          title: Longitude
          type: number
          description: A value defining the Longitude location in accordance with the ETRS89 coordinate reference system.
        single_address_line:
          title: Single Line Address
          type: string
          maxLength: 500
          description: A single attribute containing text concatenation of the address elements separated by a comma.
        street_name:
          title: Street Name
          type: string
          maxLength: 100
          description: Street / Road name for the address record.
        locality:
          title: Locality
          type: string
          maxLength: 35
          description: A locality defines an area or geographical identifier within a town, village or hamlet. Locality represents the lower level geographical area. The locality field should be used in conjunction with the town name and street description fields to uniquely identify geographic area where there may be more than one within an administrative area.
        town_name:
          title: Town Name
          type: string
          maxLength: 35
          description: Geographical town name assigned by the Local Authority. Note this can differ from the post town assigned by Royal Mail.
        delivery_point_suffix:
          title: Delivery Point Suffix
          type: string
          maxLength: 2
          description: A two-character code uniquely identifying an individual delivery point within a postcode, assigned by Royal Mail. May be empty.
        post_town:
          title: Post Town
          type: string
          maxLength: 30
          description: |-
            The town or city in which the Royal Mail sorting office servicing this address record is located.

            AddressBase populates `POST_TOWN` only where it differs from `TOWN_NAME`, so this field falls back to the town name when the raw value is empty.
        gss_code:
          title: Governmental Statistical Service
          type: string
          maxLength: 9
          description: The Office for National Statistics Governmental Statistical Service (GSS) code representing the contributing Local Authority.
        rpc:
          title: Representative Point Code
          type: integer
          description: Representative Point Code describes the accuracy of the coordinate that has been allocated to the UPRN as indicated by the Local Authority and enhanced using large scale OS data.
        last_update_date:
          title: Last Update Date
          type: string
          format: date-time
          description: The latest date on which any of the attributes on this record were last changed.
        island:
          title: Island
          type: string
          maxLength: 50
          description: Third level of geographic area name to record island names where appropriate. May be empty.
        change_code:
          title: Change Code
          type: string
          maxLength: 1
          enum:
            - I
            - U
            - D
          description: The type of change last applied to the record. `I` insert, `U` update, `D` delete.
        building_name:
          title: Building Name
          type: string
          maxLength: 110
          description: The building name is a description applied to a single address or a group of addresses. May be empty.
        building_number:
          title: Building Number
          type: string
          maxLength: 13
          description: The building number is a number or range of numbers given to a single address or a group of addresses. May be empty.
        sub_building:
          title: Sub-building
          type: string
          maxLength: 110
          description: The sub-building name and/or number for the address record. May be empty.
        postcode:
          title: Postcode
          type: string
          maxLength: 8
          description: A postcode assigned by Royal Mail for the address record.
        po_box:
          title: PO Box
          type: string
          maxLength: 13
          description: Text concatenation of 'PO BOX' and the Post Office Box (PO Box) number or 'BFPO' and the British Forces Post Office number. May be empty.
        organisation:
          title: Organisation
          type: string
          maxLength: 100
          description: The organisation name is the business name given, when appropriate, to an address record. May be empty.
        country:
          title: Country
          type: string
          description: |2
              Full country names (ISO 3166)
        county:
          title: County
          type: string
          description: Since postal, administrative or traditional counties may not apply to some addresses, the county field is designed to return whatever county data is available. Normally, the postal county is returned. If this is not present, the county field will fall back to the administrative county. If the administrative county is also not present, the county field will fall back to the traditional county. May be empty in cases where no administrative, postal or traditional county present.
        district:
          title: District
          type: string
          description: The current district/unitary authority to which the postcode has been assigned.
        ward:
          title: Ward
          type: string
          description: The current administrative/electoral area to which the postcode has been assigned. May be empty for a small number of addresses.
        traditional_county:
          title: Traditional County
          type: string
          description: Traditional counties are provided by the Association of British Counties. It is historical data, and can date from the 1800s. May be empty.
        administrative_county:
          title: Administrative County
          type: string
          description: |-
            The current administrative county to which the postcode has been assigned.

            A Unitary Authority name, where one is present. If there is no Unitary Authority, the County name is used. This information is not static, because County boundaries may change due to administrative changes.

            Source: ONS. May be empty.
        postal_county:
          title: Postal County
          type: string
          description: Postal counties were used for the distribution of mail before the Postcode system was introduced in the 1970s. The Former Postal County was the Administrative County at the time. This data rarely changes. May be empty.
      example:
        id: ab_10070014461
        country_iso: GBR
        dataset: ab
        language: en
        line_1: Flat 27
        line_2: Henry House
        line_3: Ringers Road
        premise: Flat 27, Henry House
        uprn: '10070014461'
        udprn: 53705246
        parent_uprn: '10070014435'
        usrn: 20301384
        toid: osgb5000005186746874
        classification_code: RD
        eastings: 540291
        northings: 168873
        latitude: 51.4015451
        longitude: 0.0154405
        single_address_line: Flat 27, Henry House, Ringers Road, Bromley, BR1 1AA
        street_name: Ringers Road
        locality: ''
        town_name: Bromley
        delivery_point_suffix: 2H
        post_town: Bromley
        gss_code: E09000006
        rpc: 2
        last_update_date: '2020-01-06T00:00:00.000Z'
        island: ''
        change_code: I
        building_name: Henry House
        building_number: ''
        sub_building: Flat 27
        postcode: BR1 1AA
        po_box: ''
        organisation: ''
        country: England
        county: Kent
        district: Bromley
        ward: Bromley Town
        traditional_county: Kent
        administrative_county: ''
        postal_county: Kent
    AbpAddress:
      title: AddressBase Premium Address
      description: |
        A property record from Ordnance Survey's AddressBase Premium, Ordnance Survey's most detailed address dataset for Great Britain. Each record is a Basic Land and Property Unit (BLPU) keyed by its UPRN. Alongside the Royal Mail delivery point it carries the local authority address (`pao_*`, `sao_*`, `usrn`), classification (`classification_code`), lifecycle (`logical_status`, `blpu_state`), coordinates, Welsh alternatives (`welsh_*`), the street record (`street_*`) and cross references to OS MasterMap (`toid`), the Valuation Office Agency (`council_tax_ref`, `ndr_ref`) and ONS (`ons_ward_code`, `ons_parish_code`). Ordnance Survey publishes around 40 million records and refreshes them every six weeks.

        How it differs from the neighbouring datasets:

        - **AddressBase Core** (`ab`) is a weekly, flat cut of the current approved records: one row per UPRN with coordinates, a two-character classification and the key identifiers. It carries no history, no provisional records, no Welsh alternatives, no local authority address breakdown and no street, VOA or ONS cross references.
        - **Royal Mail PAF** (`paf`) lists delivery points, keyed by UDPRN. The vast majority of PAF addresses are matched to a UPRN, but there will always be a small number (~1%) with no corresponding record on AddressBase Premium. PAF holds around 30 million GB delivery points against AddressBase Premium's 40 million UPRNs; the difference is non-postal objects (substations, car parks, sites under construction), provisional and historic records. Every GB PAF delivery point appears here as the `dpa_*` record.
        - **OS NGD Address** carries the same content restructured into feature types with daily currency. AddressBase Premium is not being retired. The Ordnance Survey end of life notice for autumn 2027 covers AddressBase and AddressBase Plus only.
      type: object
      required:
        - uprn
        - logical_status
        - country
        - latitude
        - longitude
        - x_coordinate
        - y_coordinate
        - local_custodian_code
        - addressbase_postal
        - postcode_locator
        - multi_occ_count
        - postcode
        - id
        - dataset
        - country_iso
        - suggestion_line
      properties:
        uprn:
          title: Unique Property Reference Number
          type: string
          maxLength: 12
          description: |
            Unique Property Reference Number - a persistent identifier for a Basic
            Land and Property Unit (BLPU). Up to 12 digits. Primary key for the
            BLPU spine. Carried as a string to preserve precision (12-digit values
            can exceed Number.MAX_SAFE_INTEGER).
        parent_uprn:
          title: Parent UPRN
          type: string
          maxLength: 12
          nullable: true
          description: |
            UPRN of the parent record where a parent-child relationship exists
            (flats sharing a building entrance, sub-units of a parent property).
        logical_status:
          title: Logical Status Code
          type: integer
          description: |
            Logical lifecycle status of the BLPU. `1` Approved, `6` Provisional,
            `8` Historical. BLPU records do not take value `3` (alternative).
        blpu_state:
          title: BLPU State Code
          type: string
          nullable: true
          description: |
            Physical state of the BLPU. `1` Under construction, `2` In use,
            `3` Unoccupied / vacant / derelict, `4` No longer existing,
            `6` Planning permission granted.
        blpu_state_date:
          title: BLPU State Date
          type: string
          format: date-time
          nullable: true
          description: Date the BLPU achieved its current state.
        country:
          title: Country Code
          type: string
          maxLength: 1
          description: |
            Country containing the BLPU, determined by intersection with OS
            Boundary-Line. `E` England, `W` Wales, `S` Scotland, `N` Northern
            Ireland, `L` Channel Islands, `M` Isle of Man, `J` not assigned to a
            country.
        latitude:
          title: Latitude (ETRS89)
          type: number
          format: double
          minimum: -90
          maximum: 90
          description: Latitude coordinate in the ETRS89 coordinate reference system.
        longitude:
          title: Longitude (ETRS89)
          type: number
          format: double
          minimum: -180
          maximum: 180
          description: Longitude coordinate in the ETRS89 coordinate reference system.
        x_coordinate:
          title: Eastings (OSGB36 British National Grid)
          type: number
          format: double
          description: |
            X location in metres on the OSGB36 British National Grid
            (precision 8, scale 2).
        y_coordinate:
          title: Northings (OSGB36 British National Grid)
          type: number
          format: double
          description: |
            Y location in metres on the OSGB36 British National Grid
            (precision 9, scale 2).
        rpc:
          title: Representative Point Code
          type: integer
          nullable: true
          description: |
            Representative Point Code - reliability of the BLPU's coordinate, as
            assessed by the local authority custodian. `1` Central internal,
            `2` General internal, `3` Transitional, `4` Street location,
            `5` Postcode unit, `9` Low accuracy.
        local_custodian_code:
          title: Local Custodian Code
          type: integer
          maximum: 9999
          description: |
            4-digit identifier of the Local Authority responsible for maintaining
            the record.
        addressbase_postal:
          title: AddressBase Postal Code
          type: string
          maxLength: 1
          description: |
            Whether the address can receive mail per AddressBase rules. `D` linked
            to PAF, `N` not a postal address, `C` postal with a PAF-linked parent,
            `L` postal based on Local Authority information.
        postcode_locator:
          title: Postcode Locator
          type: string
          maxLength: 8
          description: |
            Royal Mail PAF postcode, locally assigned by the custodian, or
            spatially derived where no PAF match exists. Up to 8 characters.
        multi_occ_count:
          title: Multi-occupancy Count
          type: integer
          maximum: 9999
          description: |
            Count of child UPRNs for this record where parent-child relationships
            exist.
        blpu_start_date:
          title: BLPU Start Date
          type: string
          format: date-time
          nullable: true
          description: Date the address record was inserted into the database.
        blpu_end_date:
          title: BLPU End Date
          type: string
          format: date-time
          nullable: true
          description: Date the address record was closed in the database.
        blpu_last_update_date:
          title: BLPU Last Update Date
          type: string
          format: date-time
          nullable: true
          description: Date of the most recent attribute change on the BLPU record.
        blpu_entry_date:
          title: BLPU Entry Date
          type: string
          format: date-time
          nullable: true
          description: Date the record was inserted into the Local Authority database.
        udprn:
          title: Unique Delivery Point Reference Number
          type: string
          maxLength: 8
          nullable: true
          description: |
            Royal Mail's Unique Delivery Point Reference Number - primary key for
            the Delivery Point Address (DPA) record. Up to 8 digits. NULL for
            non-postal UPRNs.
        organisation_name:
          title: Organisation Name
          type: string
          maxLength: 100
          nullable: true
          description: |
            Royal Mail-recognised organisation name from DPA, falling back to the
            AddressBase Organisation record's `organisation` when DPA is absent.
            Title-cased.
        legal_name:
          title: Legal Name
          type: string
          maxLength: 60
          nullable: true
          description: Registered legal name from the AddressBase Organisation record.
        department_name:
          title: Department Name
          type: string
          maxLength: 60
          nullable: true
          description: |
            Subdivision of an organisation that receives mail at a distinct
            delivery point. Requires `organisation_name` to be present.
            Title-cased.
        sub_building_name:
          title: Sub-building Name
          type: string
          maxLength: 30
          nullable: true
          description: |
            Property subdivision identifier (e.g. flat number). Requires
            `building_name` or `building_number`. Title-cased. Falls back to the
            LPI's `sao_text` when there is no delivery point.
        building_name:
          title: Building Name
          type: string
          maxLength: 50
          nullable: true
          description: |
            Descriptive name applied to a single building or small group of
            buildings. Title-cased. Falls back to the LPI's SAO number/range plus
            `pao_text` when there is no delivery point.
        building_number:
          title: Building Number
          type: integer
          maximum: 9999
          nullable: true
          description: |
            Numeric identifier for a single building or small group of buildings.
            Complex number formats (e.g. "12A") go in `building_name` or
            `sub_building_name`. Falls back to the LPI's `pao_start_number` when
            there is no delivery point and that number is a bare integer - a
            suffixed or ranged PAO number is folded onto `thoroughfare` instead.
        dependent_thoroughfare:
          title: Dependent Thoroughfare
          type: string
          maxLength: 80
          nullable: true
          description: |
            Named thoroughfare within another named thoroughfare. Requires
            `thoroughfare` to be present. Title-cased.
        thoroughfare:
          title: Thoroughfare
          type: string
          maxLength: 80
          nullable: true
          description: |
            Road, track or named access route with Royal Mail delivery points.
            Title-cased. Falls back to the LPI street's `street_description` (with a
            suffixed or ranged PAO number prefixed) when there is no delivery point.
        double_dependent_locality:
          title: Double Dependent Locality
          type: string
          maxLength: 35
          nullable: true
          description: |
            Estate or area name used to distinguish similar thoroughfares within a
            dependent locality. Requires `dependent_locality`. Title-cased.
        dependent_locality:
          title: Dependent Locality
          type: string
          maxLength: 35
          nullable: true
          description: |
            Subdivision of a post town to differentiate same-name thoroughfares.
            Title-cased. Falls back to the LPI street's `street_locality` when there
            is no delivery point.
        post_town:
          title: Post Town
          type: string
          maxLength: 30
          nullable: true
          description: |
            Town or city of the Royal Mail sorting office serving this record.
            Capitalised. Falls back to the LPI street's `street_town` when there is
            no delivery point; NULL when neither is present.
        postcode:
          title: Postcode
          type: string
          maxLength: 8
          description: |
            Royal Mail postcode from DPA, falling back to BLPU's `postcode_locator`
            when no Royal Mail delivery point exists. Uppercased, with single space
            between outward and inward portions.
        postcode_type:
          title: Postcode Type Code
          type: string
          maxLength: 1
          nullable: true
          description: |
            Royal Mail postal-user category. `S` Small user (e.g. a residential
            property), `L` Large user (e.g. a large commercial company).
        delivery_point_suffix:
          title: Delivery Point Suffix
          type: string
          maxLength: 2
          nullable: true
          description: |
            Two-character code uniquely identifying an individual delivery point
            within a postcode (Royal Mail DPS).
        po_box_number:
          title: PO Box Number
          type: string
          maxLength: 6
          nullable: true
          description: Post Office Box number.
        welsh_dependent_thoroughfare:
          title: Welsh Dependent Thoroughfare
          type: string
          maxLength: 80
          nullable: true
          description: Welsh translation of `dependent_thoroughfare`. Requires `welsh_thoroughfare`.
        welsh_thoroughfare:
          title: Welsh Thoroughfare
          type: string
          maxLength: 80
          nullable: true
          description: Welsh translation of `thoroughfare`.
        welsh_double_dependent_locality:
          title: Welsh Double Dependent Locality
          type: string
          maxLength: 36
          nullable: true
          description: Welsh translation of `double_dependent_locality`. Requires `welsh_dependent_locality`.
        welsh_dependent_locality:
          title: Welsh Dependent Locality
          type: string
          maxLength: 35
          nullable: true
          description: Welsh translation of `dependent_locality`.
        welsh_post_town:
          title: Welsh Post Town
          type: string
          maxLength: 30
          nullable: true
          description: Welsh translation of `post_town`.
        dpa_process_date:
          title: DPA Process Date
          type: string
          format: date-time
          nullable: true
          description: Date the PAF record was processed into the database.
        dpa_start_date:
          title: DPA Start Date
          type: string
          format: date-time
          nullable: true
          description: Date the address record was matched to the Delivery Point Address.
        dpa_end_date:
          title: DPA End Date
          type: string
          format: date-time
          nullable: true
          description: Date the PAF record no longer existed in the database.
        dpa_last_update_date:
          title: DPA Last Update Date
          type: string
          format: date-time
          nullable: true
          description: Date any attribute on the DPA record was last changed.
        dpa_entry_date:
          title: DPA Entry Date
          type: string
          format: date-time
          nullable: true
          description: Date the PAF record was first loaded by GeoPlace.
        classification_code:
          title: Classification Code
          type: string
          maxLength: 6
          nullable: true
          description: |
            Current AddressBase classification code (e.g. `RD` residential,
            `CR` commercial retail). Top-level categories: `R` Residential,
            `C` Commercial, `L` Land, `M` Military, `O` Other, `P` Parent shell,
            `U` Unclassified, `X` Dual use, `Z` Object of interest. NULL when no
            current classification row exists for the UPRN.
        class_scheme:
          title: Classification Scheme
          type: string
          maxLength: 60
          nullable: true
          description: Name of the classification scheme applied to this record.
        scheme_version:
          title: Classification Scheme Version
          type: number
          nullable: true
          description: Version number of the classification scheme in use (e.g. `1.0`).
        classification_start_date:
          title: Classification Start Date
          type: string
          format: date-time
          nullable: true
          description: Date the classification record was first loaded into the database.
        classification_end_date:
          title: Classification End Date
          type: string
          format: date-time
          nullable: true
          description: Date the classification record ceased to exist.
        classification_last_update_date:
          title: Classification Last Update Date
          type: string
          format: date-time
          nullable: true
          description: Date of the most recent attribute change on the classification record.
        classification_entry_date:
          title: Classification Entry Date
          type: string
          format: date-time
          nullable: true
          description: |
            Date the associated address record was inserted into the Local
            Authority database.
        organisation_start_date:
          title: Organisation Start Date
          type: string
          format: date-time
          nullable: true
          description: Date the organisation record was initially loaded into the database.
        organisation_end_date:
          title: Organisation End Date
          type: string
          format: date-time
          nullable: true
          description: Date the organisation record ceased to exist.
        organisation_last_update_date:
          title: Organisation Last Update Date
          type: string
          format: date-time
          nullable: true
          description: Date of the most recent attribute change on the organisation record.
        organisation_entry_date:
          title: Organisation Entry Date
          type: string
          format: date-time
          nullable: true
          description: Date the UPRN was entered into the Local Authority database.
        lpi_key:
          title: LPI Key
          type: string
          maxLength: 14
          nullable: true
          description: Unique identifier and primary key for the LPI record.
        lpi_language:
          title: LPI Language Code
          type: string
          maxLength: 3
          nullable: true
          description: |
            Language used for this LPI record. `ENG` English, `CYM` Welsh,
            `GAE` Gaelic (Scottish), `BIL` Bilingual.
        lpi_logical_status:
          title: LPI Logical Status Code
          type: integer
          nullable: true
          description: |
            Logical status of the LPI record. `1` Approved, `3` Alternative,
            `6` Provisional, `8` Historical.
        lpi_start_date:
          title: LPI Start Date
          type: string
          format: date-time
          nullable: true
          description: Date the LPI was first loaded into the database.
        lpi_end_date:
          title: LPI End Date
          type: string
          format: date-time
          nullable: true
          description: Date the LPI record ceased to exist.
        lpi_last_update_date:
          title: LPI Last Update Date
          type: string
          format: date-time
          nullable: true
          description: Date of the most recent attribute change on the LPI record.
        lpi_entry_date:
          title: LPI Entry Date
          type: string
          format: date-time
          nullable: true
          description: Date the LPI record was inserted into the Local Authority database.
        sao_start_number:
          title: SAO Start Number
          type: integer
          maximum: 9999
          nullable: true
          description: |
            Number of the Secondary Addressable Object, or range start. Requires
            `pao_start_number` or `pao_text` to be present.
        sao_start_suffix:
          title: SAO Start Suffix
          type: string
          maxLength: 2
          nullable: true
          description: Suffix appended to `sao_start_number`. Requires `sao_start_number`.
        sao_end_number:
          title: SAO End Number
          type: integer
          maximum: 9999
          nullable: true
          description: End number of the SAO range. Requires `sao_start_number`.
        sao_end_suffix:
          title: SAO End Suffix
          type: string
          maxLength: 2
          nullable: true
          description: Suffix appended to `sao_end_number`. Requires `sao_end_number`.
        sao_text:
          title: SAO Text
          type: string
          maxLength: 90
          nullable: true
          description: |
            Building name or description for the Secondary Addressable Object
            (e.g. "FLAT 1", "UNIT B"). Requires `pao_start_number` or `pao_text`.
        pao_start_number:
          title: PAO Start Number
          type: integer
          maximum: 9999
          nullable: true
          description: |
            Number of the Primary Addressable Object, or range start. Mandatory if
            `pao_text` is absent.
        pao_start_suffix:
          title: PAO Start Suffix
          type: string
          maxLength: 2
          nullable: true
          description: Suffix appended to `pao_start_number`. Requires `pao_start_number`.
        pao_end_number:
          title: PAO End Number
          type: integer
          maximum: 9999
          nullable: true
          description: End number of the PAO range. Requires `pao_start_number`.
        pao_end_suffix:
          title: PAO End Suffix
          type: string
          maxLength: 2
          nullable: true
          description: Suffix appended to `pao_end_number`. Requires `pao_end_number`.
        pao_text:
          title: PAO Text
          type: string
          maxLength: 90
          nullable: true
          description: |
            Building name or description for the Primary Addressable Object.
            Mandatory if `pao_start_number` is absent.
        usrn:
          title: Unique Street Reference Number
          type: string
          maxLength: 8
          nullable: true
          description: |
            Unique Street Reference Number linking this LPI to its Street record.
            Up to 8 digits.
        usrn_match_indicator:
          title: USRN Match Indicator Code
          type: string
          nullable: true
          description: |
            Confidence of the LPI to Street linkage. `1` Matched manually to the
            nearest accessible Street, `2` Matched spatially to the nearest USRN.
        area_name:
          title: Area Name
          type: string
          maxLength: 40
          nullable: true
          description: Third-level geographic area name such as island or property group.
        level:
          title: Level
          type: string
          maxLength: 30
          nullable: true
          description: Vertical position of the property (e.g. "GROUND FLOOR").
        official_flag:
          title: Official Flag Code
          type: string
          maxLength: 1
          nullable: true
          description: |
            Whether the LPI corresponds to an entry in the official Street Name and
            Numbering register. `Y` Official address, `N` Unofficial address.
        street_record_type:
          title: Street Record Type Code
          type: integer
          nullable: true
          description: |
            Description of the street record type. `1` Official designated Street
            Name, `2` Street Description, `3` Numbered Street, `4` Unofficial
            Street Description, `9` Description used for LLPG Access.
        swa_org_ref_naming:
          title: SWA Org Ref (Naming)
          type: integer
          maximum: 9999
          nullable: true
          description: |
            Code identifying the Street Naming and Numbering Authority or Local
            Highway Authority (DfT-allocated).
        street_state:
          title: Street State Code
          type: string
          nullable: true
          description: |
            Current state of the street. `1` Under construction, `2` Open,
            `4` Permanently closed.
        street_state_date:
          title: Street State Date
          type: string
          format: date-time
          nullable: true
          description: Date when the street achieved its current state.
        street_surface:
          title: Street Surface Code
          type: string
          nullable: true
          description: |
            Surface finish of the street. `1` Metalled, `2` Unmetalled, `3` Mixed.
        street_classification:
          title: Street Classification Code
          type: string
          nullable: true
          description: |
            Primary classification of the street record. `4` Pedestrian way or
            footpath, `6` Cycletrack or cycleway, `8` All vehicles, `9` Restricted
            byway, `10` Bridleway.
        street_start_date:
          title: Street Start Date
          type: string
          format: date-time
          nullable: true
          description: Date this street record or version was inserted into the database.
        street_last_update_date:
          title: Street Last Update Date
          type: string
          format: date-time
          nullable: true
          description: Date when any attribute of the street record was last changed.
        street_record_entry_date:
          title: Street Record Entry Date
          type: string
          format: date-time
          nullable: true
          description: Date the street record was entered into the Local Authority database.
        street_start_x:
          title: Street Start Eastings
          type: number
          format: double
          nullable: true
          description: X coordinate (BNG) for the street start point.
        street_start_y:
          title: Street Start Northings
          type: number
          format: double
          nullable: true
          description: Y coordinate (BNG) for the street start point.
        street_start_lat:
          title: Street Start Latitude
          type: number
          format: double
          nullable: true
          description: Latitude (ETRS89) for the street start point.
        street_start_long:
          title: Street Start Longitude
          type: number
          format: double
          nullable: true
          description: Longitude (ETRS89) for the street start point.
        street_end_x:
          title: Street End Eastings
          type: number
          format: double
          nullable: true
          description: X coordinate (BNG) for the street end point.
        street_end_y:
          title: Street End Northings
          type: number
          format: double
          nullable: true
          description: Y coordinate (BNG) for the street end point.
        street_end_lat:
          title: Street End Latitude
          type: number
          format: double
          nullable: true

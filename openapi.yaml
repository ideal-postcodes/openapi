        Address from France's Base Adresse Nationale (BAN), the official open national
        address database published via Etalab.

        BAN reaches house-number level only (`numero` + street + commune) - it carries
        no sub-premise (unit, floor, building) data.
      required:
        - id
        - dataset
        - country
        - country_iso
        - country_iso_2
        - language
        - address
        - line_1
        - line_2
        - latitude
        - longitude
        - id_fantoir
        - numero
        - rep
        - nom_voie
        - code_postal
        - code_insee
        - nom_commune
        - code_insee_ancienne_commune
        - nom_ancienne_commune
        - x
        - 'y'
        - lon
        - lat
        - type_position
        - alias
        - nom_ld
        - libelle_acheminement
        - nom_afnor
        - source_position
        - source_nom_voie
        - certification_commune
        - cad_parcelles
      properties:
        id:
          $ref: '#/components/schemas/ID'
        dataset:
          type: string
          enum:
            - ban
        country:
          type: string
          description: |2
              Full country names (ISO 3166)
          enum:
            - France
        country_iso:
          type: string
          description: |2
              3 letter country code (ISO 3166-1)
          enum:
            - FRA
        country_iso_2:
          type: string
          description: |2
             2 letter country code (ISO 3166-1)
          enum:
            - FR
        language:
          type: string
          enum:
            - fr
          description: |
            Language represented by 2 letter ISO Code (639-1)
        address:
          type: string
          description: |
            The house number of the address (`numero`), without any suffix.

            Can be empty string `""` if not present.
        line_1:
          type: string
          nullable: true
          description: |
            First address line (house number, suffix, and street name).

            Can be `null` if not present.
        line_2:
          type: string
          nullable: true
          description: |
            Second address line (postcode and municipality name).

            Can be `null` if not present.
        latitude:
          $ref: '#/components/schemas/Latitude'
        longitude:

      Raw Royal Mail Alias record.

      <SchemaDefinition schemaRef="#/components/schemas/PafaAddress" />
  - name: pafw_native
    x-displayName: Welsh PAF
    description: |
      Raw Royal Mail Welsh language record.

      <SchemaDefinition schemaRef="#/components/schemas/PafwAddress" />
  - name: ecaf_address
    x-displayName: IE Eircode ECAF
    description: |
      Standard Republic of Ireland Address format as reported by the Eircode ECAF file.

      <SchemaDefinition schemaRef="#/components/schemas/EcafAddress" />
  - name: ecad_address
    x-displayName: IE Eircode ECAD
    description: |
      ECAF file including additional data for each address.

      <SchemaDefinition schemaRef="#/components/schemas/EcadAddress" />
  - name: ab_address
    x-displayName: AddressBase Core
    description: |
      AddressBase Core Address. An alternative to UK PAF dataset from Ordnance Survey.

      Please contact us to have this enabled on your account.

      <SchemaDefinition schemaRef="#/components/schemas/AbAddress" />
  - name: abp_address

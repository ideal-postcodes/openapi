          description: A unique name to identify the configuration payload
          minLength: 1
          maxLength: 32
        payload:
          example: |
            {
              "removeOrganisation": false
            }
          type: string
          minLength: 0
          maxLength: 65536
          description: A serialised payload of up to `65536` characters
    ConfigResponse:
      title: Config Response
